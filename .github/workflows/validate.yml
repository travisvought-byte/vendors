name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r pipeline/requirements.txt
      - name: Privacy and shape checks
        run: python -m unittest discover -s tests -v
      - name: Committed data matches the committed snapshots
        run: |
          cp data/vendors.json /tmp/committed.json
          python -m pipeline.run --offline
          python - <<'PY'
          import json
          a, b = json.load(open('/tmp/committed.json')), json.load(open('data/vendors.json'))
          a.pop('built_on'); b.pop('built_on')
          if a != b:
              raise SystemExit('data/vendors.json is out of date: run python -m pipeline.run --offline and commit it')
          print('vendors.json matches the snapshots')
          PY
